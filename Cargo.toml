[package]
name = "textovervoice-core"
version = "0.1.0"
edition = "2021"
description = "Portable protocol/DSP/FEC core for TextOverVoice, shared between the native CLI and the WASM web client"
license = "MIT"
repository = "https://github.com/SEKY443/textovervoice-core"

[lib]
name = "textovervoice_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
chacha20poly1305 = "0.11.0"
crc = "3.4.0"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
phf = "0.14.0"
realfft = "3.5.0"
rustfft = "6.4.1"
sha2 = "0.11.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }

[build-dependencies]
phf_codegen = "0.14.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
rand = "0.10.2"
rand_distr = "0.6.0"

[features]
# Enables getrandom's browser RNG backend (crypto.getRandomValues), required
# when building for wasm32-unknown-unknown. Left off by default so this
# crate stays honest about not forcing a browser-specific RNG backend on
# hypothetical future non-browser consumers -- the wasm-bindgen crate that
# actually targets the browser turns this on.
wasm-browser = ["getrandom/wasm_js"]

[[bench]]
name = "modem"
harness = false

[[bench]]
name = "fec"
harness = false

[[bench]]
name = "protocol_end_to_end"
harness = false

[profile.release]
lto = true
strip = true
codegen-units = 1
